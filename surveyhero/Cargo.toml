[package]
name = "surveyhero"
version = "0.1.0"
edition = "2018"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
regex = "1.11"
reqwest = { version = "0.13", features = ["blocking", "json", "default-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3.2.1"
